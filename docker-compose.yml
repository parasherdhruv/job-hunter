services:
  postgres:
    image: postgres:16-alpine
    container_name: job-hunter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_hunter
    ports:
      - "5432:5432"
    volumes:
      - job_hunter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_hunter"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  job_hunter_pgdata:
